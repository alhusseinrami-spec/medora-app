plugins { id "com.android.application" }

// The Medora Care app opens the live shop as a Trusted Web Activity:
// prices and products always come from the website, so there's nothing to update here when they change.
def siteHost = "medora-app-gamma.vercel.app"
def startPath = "/shop"

android {
    namespace "com.medoracare.shop"
    compileSdk 36

    defaultConfig {
        applicationId "com.medoracare.shop"
        minSdk 23
        targetSdk 36
        // Raise both for every upload to Google Play.
        versionCode 1
        versionName "1.0.0"

        resValue "string", "app_name", "Medora Care"
        resValue "string", "launch_url", "https://${siteHost}${startPath}"
        resValue "string", "host", siteHost
        resValue "string", "provider_authority", "com.medoracare.shop.fileprovider"
        resValue "string", "asset_statements",
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${siteHost}\\\" } }]"
        manifestPlaceholders = [hostName: siteHost]
    }

    // Release builds are signed after the build, with the upload key kept outside git
    // (see android/README.md). A signing config is used only when these are set.
    signingConfigs {
        upload {
            if (System.getenv("MEDORA_KEYSTORE")) {
                storeFile file(System.getenv("MEDORA_KEYSTORE"))
                storePassword System.getenv("MEDORA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MEDORA_KEY_ALIAS") ?: "medora"
                keyPassword System.getenv("MEDORA_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("MEDORA_KEYSTORE")) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

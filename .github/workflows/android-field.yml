# Builds the Medora Field Android app (android-field/) without signing it.
# The signing key never goes to GitHub: download the "medora-field-android-unsigned" artifact
# and sign it with the key from the project files (android-field/README.md, "Signing").
name: Field Android app

on:
  workflow_dispatch:
  push:
    paths: ["android-field/**", ".github/workflows/android-field.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the APK and app bundle
        working-directory: android-field
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: medora-field-android-unsigned
          path: |
            android-field/app/build/outputs/apk/release/*.apk
            android-field/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      # TEMPORARY: hands the unsigned build over for signing outside GitHub. Removed after the first build.
      - name: Hand the unsigned build over
        run: |
          mkdir /tmp/out && cp android-field/app/build/outputs/apk/release/*.apk android-field/app/build/outputs/bundle/release/*.aab /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b android-field-build-output
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Unsigned field build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-field-build-output
